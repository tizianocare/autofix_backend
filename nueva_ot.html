<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Orden de Trabajo - AutoFix</title>
</head>
<body>

    <h2>Ingresar Vehículo al Taller</h2>

    <form id="form-ot">
        <label for="nombre_completo">Nombre del Cliente:</label>
        <input type="text" id="nombre_completo" name="nombre_completo" maxlength="120" required>
        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+5491112345678" required>
        <br><br>

        <label for="patente">Patente del Vehículo:</label>
        <input type="text" id="patente" name="patente" placeholder="AA123CD" maxlength="10" required>
        <br><br>

        <label for="marca">Marca:</label>
        <input type="text" id="marca" name="marca" maxlength="50" required>
        <br><br>

        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" name="modelo" maxlength="50" required>
        <br><br>

        <label for="fallas_reportadas">Motivo de Ingreso / Fallas Reportadas:</label><br>
        <textarea id="fallas_reportadas" name="fallas_reportadas" rows="5" cols="60" required></textarea>
        <br><br>

        <button type="submit">Guardar Orden de Trabajo</button>
    </form>

    <p id="mensaje"></p>
    <p><a href="panel.html">Ver panel de órdenes</a></p>

    <script>
        const form = document.getElementById('form-ot');
        const mensaje = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensaje.textContent = 'Guardando...';

            const datos = Object.fromEntries(new FormData(form).entries());

            try {
                const respuesta = await fetch('http://localhost:3000/api/ordenes-trabajo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    mensaje.textContent = '❌ ' + resultado.error;
                    return;
                }
                mensaje.textContent = '✅ ' + resultado.mensaje + ' N° de OT: ' + resultado.numero_ot;
                form.reset();
            } catch (error) {
                mensaje.textContent = '❌ No se pudo conectar con el servidor.';
            }
        });
    </script>

</body>
</html>
